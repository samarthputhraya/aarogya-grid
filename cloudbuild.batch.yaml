# Builds the nightly batch image (Dockerfile.batch) into the same Artifact
# Registry repository `gcloud run deploy --source` already uses for the service.
#
#   gcloud builds submit --config=cloudbuild.batch.yaml --region=asia-south1 .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'Dockerfile.batch', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/aarogya-batch:latest
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
